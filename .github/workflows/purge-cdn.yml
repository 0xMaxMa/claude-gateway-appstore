name: purge-cdn

# After a publish lands on main, jsDelivr keeps serving the old apps.json
# (and old assets) from its edge cache for up to 12h (s-maxage=43200 on the
# mutable @main ref). Purge every changed path so the catalog updates in
# seconds. Standalone: only checkout + git + the public jsDelivr purge
# endpoint — no secrets, no token, no getpod coupling.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: purge-cdn-${{ github.ref }}
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Purge jsDelivr edge cache for changed paths
        env:
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -u
          ZERO="0000000000000000000000000000000000000000"

          purge() {
            path="$1"
            [ -z "$path" ] && return 0
            url="https://purge.jsdelivr.net/gh/${REPO}@main/${path}"
            echo "purge: ${url}"
            # Best-effort: a jsDelivr rate-limit or transient error must never
            # red the run.
            curl -fsS -m 30 "${url}" || echo "  (purge failed — ignored)"
            echo
          }

          # Try to compute the changed files from the pushed range. Fall back to
          # a full purge when no usable range exists: manual workflow_dispatch,
          # or a first/force push whose `before` is the all-zero sha (or is not
          # present in this checkout).
          changed=""
          if [ "${EVENT_NAME}" = "push" ] \
             && [ -n "${BEFORE}" ] \
             && [ "${BEFORE}" != "${ZERO}" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "${BEFORE}" "${AFTER}")"
          fi

          if [ -z "${changed}" ]; then
            echo "No diff range available — purging apps.json + everything under apps/"
            purge "apps.json"
            find apps -type f 2>/dev/null | sort | while IFS= read -r f; do
              purge "${f}"
            done
            exit 0
          fi

          # Always purge apps.json, plus every changed file (deduped, blanks removed).
          { echo "apps.json"; echo "${changed}"; } | sed '/^[[:space:]]*$/d' | sort -u \
            | while IFS= read -r f; do
                purge "${f}"
              done
